appId: com.cooklink.app
---
- launchApp:
    clearState: false
- tapOn: 'Groceries'
- scrollUntilVisible:
    element:
      text: 'Where should Instamart deliver?'
    direction: DOWN
    timeout: 20000
    speed: 50
- scrollUntilVisible:
    element:
      text: 'Choose Fresh Farms Tomatoes, 500 g'
    direction: DOWN
    timeout: 20000
    speed: 40
- takeScreenshot: 'artifacts/store-screenshots/raw/06-instamart-products'
