executionPrerequisite: Cooklink design preview is open on the Today screen with microphone permission granted
steps:
  - assert: { visible: { id: today-screen } }
  - echo: On Today; open Household Chat and expect the Chat screen.
  - tap: { text: Household Chat }
  - await: { visible: { text: Message the household }, timeout: 15000 }
  - await: { idle: true, timeout: 9000 }
  - echo: Chat is ready; start recording, wait five seconds, stop, and expect review controls.
  - tap: { id: record-voice-note-button }
  - wait: 5000
  - tap: { id: record-voice-note-button }
  - await: { visible: { text: Voice note ready }, timeout: 10000 }
